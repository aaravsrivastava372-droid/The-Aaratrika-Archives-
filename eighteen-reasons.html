
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eighteen Reasons | The Aaratrika Archives</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #26304d 0%, #11182c 48%, #080d19 100%);
    color: #f5e8d0;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 55px 20px 25px;
}

.eyebrow {
    color: #d6b779;
    letter-spacing: 4px;
    font: 11px Arial, sans-serif;
}

h1 {
    color: #f0d39b;
    font-size: clamp(32px, 8vw, 52px);
    font-weight: normal;
    margin: 18px 0 12px;
    text-shadow: 0 0 25px #c49b5833;
}

.subtitle {
    color: #d4c4a8;
    font-style: italic;
    line-height: 1.8;
    max-width: 520px;
    margin: auto;
    font-size: 15px;
}

.instruction {
    text-align: center;
    color: #c5ae83;
    font: 11px Arial, sans-serif;
    letter-spacing: 2px;
    margin: 25px 0;
}

.star-grid {
    width: min(700px, 92%);
    margin: 35px auto 55px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.star {
    min-height: 105px;
    border: 1px solid #b99a6255;
    border-radius: 12px;
    background: linear-gradient(145deg, #26304a, #151d31);
    color: #e9c982;
    cursor: pointer;
    transition: .3s ease;
    box-shadow: 0 5px 20px #0003;
}

.star:hover {
    transform: translateY(-5px);
    border-color: #e7c47d;
    box-shadow: 0 0 22px #d6b77933;
}

.star .symbol {
    display: block;
    font-size: 30px;
    margin-bottom: 7px;
    text-shadow: 0 0 15px #e6c37a88;
}

.star .number {
    font: 10px Arial, sans-serif;
    letter-spacing: 2px;
    color: #cbb68c;
}

.star.opened {
    background: linear-gradient(145deg, #51442f, #25263a);
    border-color: #e5c17d;
    box-shadow: 0 0 25px #e2bd7033;
}

footer {
    text-align: center;
    padding: 15px 25px 55px;
    color: #c9b58f;
    font-style: italic;
    line-height: 1.8;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050916ed;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
    animation: fadeIn .4s ease;
}

.paper {
    width: min(480px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    background: linear-gradient(145deg, #f3e6cb, #dfc9a3);
    color: #493a2b;
    padding: 35px 25px;
    border: 5px double #a8895b;
    text-align: center;
    box-shadow: 0 0 45px #d8b66b33;
    animation: rise .45s ease;
}

.paper .reason-number {
    color: #96734c;
    font: 11px Arial, sans-serif;
    letter-spacing: 3px;
}

.paper .reason-symbol {
    font-size: 36px;
    margin: 15px 0;
}

.paper h2 {
    font-size: 25px;
    font-weight: normal;
    color: #745237;
    margin: 10px 0 20px;
}

.paper p {
    font-size: 16px;
    line-height: 1.9;
}

.close {
    margin-top: 20px;
    padding: 11px 25px;
    background: transparent;
    border: 1px solid #92734e;
    color: #604a32;
    font-family: Georgia, serif;
    cursor: pointer;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 430px) {
    .star-grid {
        gap: 11px;
    }

    .star {
        min-height: 90px;
    }

    .star .symbol {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<header>
    <div class="eyebrow">THE AARATRIKA ARCHIVES · EXHIBIT IV</div>

    <h1>Eighteen Reasons</h1>

    <p class="subtitle">
        Eighteen years. A thousand little things to love.
        And somehow, I managed to narrow it down to eighteen.
    </p>
</header>

<div class="instruction">
    ✦ TAP A STAR TO DISCOVER A REASON ✦
</div>

<div class="star-grid" id="starGrid"></div>

<footer>
    And if I had another eighteen stars,<br>
    I would still find eighteen more reasons.
</footer>

<div class="modal" id="reasonModal">
    <div class="paper">
        <div class="reason-number" id="reasonNumber"></div>
        <div class="reason-symbol" id="reasonSymbol"></div>
        <h2 id="reasonTitle"></h2>
        <p id="reasonText"></p>
        <button class="close" onclick="closeReason()">
            Return to the stars
        </button>
    </div>
</div>

<script>
const reasons = [

{
    title: "The Way You Care",
    symbol: "🌷",
    text: "The way you care about people. You notice them, you think about them, and you make an effort to make things better. It's one of the most beautiful things about you."
},

{
    title: "Simply You",
    symbol: "✨",
    text: "Your beauty. And I don't mean just what meets the eye. There's something about you that makes you genuinely mesmerizing to me. I hope you see even a fraction of what I see."
},

{
    title: "Aunty's Garlic Bread",
    symbol: "🍞",
    text: "Aunty ke garlic bread. Of course. Some things are simply too important to leave out of this list. This one deserves its own star."
},

{
    title: "That Laughter",
    symbol: "☀️",
    text: "Your laughter. Especially when you laugh uncontrollably and forget everything else for a moment. Seeing you genuinely happy is one of my favourite things."
},

{
    title: "Dreams Without Limits",
    symbol: "🌠",
    text: "Your ambitions, and how strong they are. I love that you have things you want to achieve and that you carry those dreams with such determination. I hope you achieve every single one."
},

{
    title: "My Ordinary Days",
    symbol: "🌻",
    text: "You always make my ordinary days better. Sometimes nothing extraordinary happens, but somehow, having you in my life makes an otherwise normal day feel special."
},

{
    title: "You Never Give Up",
    symbol: "🕯️",
    text: "You never give up on me. Even when things aren't easy, you keep trying. I don't take that for granted, and I hope you know how much it means to me."
},

{
    title: "My Favourite Comedian",
    symbol: "🎭",
    text: "You make me laugh. Whether you intend to or not, you have this way of making me forget whatever was bothering me. Life is a little less serious with you around."
},

{
    title: "Your Kindness, Even on Difficult Days",
    symbol: "🪷",
    text: "Even at your worst, you try to be good for everyone. I know you have difficult days too, but you still try to show kindness. I wish you gave yourself the same gentleness."
},

{
    title: "The Depth of Your Love",
    symbol: "💗",
    text: "You love people deeply. When someone matters to you, you genuinely care. There's a certain sincerity in the way you love, and I admire that about you."
},

{
    title: "A Mind of Your Own",
    symbol: "⚖️",
    text: "You understand the line between morality and legality. You know that something being legal doesn't automatically make it right. I love how thoughtfully you look at the world."
},

{
    title: "Standing for What's Right",
    symbol: "🔥",
    text: "You stand for what's right, not for who's right. You don't let loyalty or someone's identity decide whether their actions are justified. That takes courage and conviction."
},

{
    title: "You Stay",
    symbol: "🌙",
    text: "You never leave my side. Through the good days and the difficult ones, your presence has meant more to me than I could ever properly explain."
},

{
    title: "A Wonderful Daughter",
    symbol: "🏡",
    text: "You are the best daughter. The love and care you give to your family are another part of who you are that I deeply admire."
},

{
    title: "A Wonderful Sister",
    symbol: "🧸",
    text: "You are the best sister. There's something special about the way you hold your place in your family's world, and I hope you always know how loved you are."
},

{
    title: "The Bestest Friend",
    symbol: "🫂",
    text: "You are the bestest friend. Beyond everything else, I love that I get to have you as someone I can laugh with, talk to, and share this strange little life with."
},

{
    title: "My Aaratrikaa",
    symbol: "💐",
    text: "You are the bestest bestest bestest girlfriend, Aaratrikaa. Yes, I deliberately used bestest three times. One simply wasn't enough."
},

{
    title: "The Simplest Reason",
    symbol: "❤️",
    text: "Oh, I almost forgot. I love you. Not because I needed eighteen reasons to justify it. These are simply eighteen little things that remind me why I'm so grateful to have you in my life."
}

];

const grid = document.getElementById("starGrid");

reasons.forEach(function(reason, index) {
    const button = document.createElement("button");
    button.className = "star";
    button.innerHTML =
        '<span class="symbol">✦</span>' +
        '<span class="number">STAR ' +
        String(index + 1).padStart(2, "0") +
        '</span>';

    button.addEventListener("click", function() {
        openReason(index);
        button.classList.add("opened");
    });

    grid.appendChild(button);
});

function openReason(index) {
    const reason = reasons[index];

    document.getElementById("reasonNumber").textContent =
        "REASON " + String(index + 1).padStart(2, "0");

    document.getElementById("reasonSymbol").textContent =
        reason.symbol;

    document.getElementById("reasonTitle").textContent =
        reason.title;

    document.getElementById("reasonText").textContent =
        reason.text;

    document.getElementById("reasonModal").classList.add("show");
    document.body.style.overflow = "hidden";
}

function closeReason() {
    document.getElementById("reasonModal").classList.remove("show");
    document.body.style.overflow = "";
}

document.getElementById("reasonModal").addEventListener(
    "click",
    function(event) {
        if (event.target === this) {
            closeReason();
        }
    }
);

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeReason();
    }
});
</script>

</body>
  </html>
